spring.application.name=backend
server.port=${PORT:8081}

# Database configuration
# Automatically works with Railway MySQL variables (MYSQLHOST, MYSQLPORT, MYSQLUSER, MYSQLPASSWORD, MYSQLDATABASE)
# as well as local fallback
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL_JDBC:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:railway}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:tiger}}

# HikariCP connection settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
app.jwt.secret=${APP_JWT_SECRET:ZmMyNWM4ZmQ0YjE3ZjQxOTNkNGE1ZDY2ZjA4YzY2ZmZjMjVjOGZkNGIxN2Y0MTkzZDRhNWQ2NmYwOGM2NmY=}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:86400000}

# Frontend origin allowed for CORS (comma separated)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5174,https://*.railway.app}
